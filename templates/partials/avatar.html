{% load static %}{% with profile=user.learner_profile %}{% if profile.avatar %}<span class="avatar avatar-{{ size|default:'small' }} avatar-mascot" aria-hidden="true"><img src="{% static 'img/mascots/' %}{{ profile.avatar }}.svg" alt=""></span>{% else %}<span class="avatar avatar-{{ size|default:'small' }}" aria-hidden="true">{{ user.first_name|default:user.username|first|upper }}</span>{% endif %}{% endwith %}
