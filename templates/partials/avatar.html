{% load static %}{% with profile=user.learner_profile %}{% if profile.avatar_file %}<span class="avatar avatar-{{ size|default:'small' }} avatar-picture" aria-hidden="true"><img src="{% static 'img/avatars/' %}{{ profile.avatar_file }}.svg" alt=""></span>{% else %}<span class="avatar avatar-{{ size|default:'small' }}" aria-hidden="true">{{ user.first_name|default:user.username|first|upper }}</span>{% endif %}{% endwith %}
