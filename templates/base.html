{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CodeAgapay{% endblock %}</title>
  <link rel="icon" href="{% static 'img/mascots/flower-pink.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Nunito+Sans:wght@400;600;700;800&family=Roboto:wght@500&display=swap">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script src="{% static 'js/forms.js' %}" defer></script>
</head>
<body>
  {% block navbar %}{% include "partials/navbar.html" %}{% endblock %}
  {% block main %}
  <main class="page {% block page_class %}{% endblock %}">
    {% include "partials/messages.html" %}
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
